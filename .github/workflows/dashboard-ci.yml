name: Dashboard CI

on:
  pull_request:
    paths:
      - "dashboard_guardias/**"
      - ".github/workflows/dashboard-ci.yml"
  push:
    branches:
      - main
      - develop
      - "release/**"
      - "hotfix/**"
    paths:
      - "dashboard_guardias/**"
      - ".github/workflows/dashboard-ci.yml"

jobs:
  dashboard-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: dashboard_guardias

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard_guardias/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build dashboard
        run: npm run build
